            </div>
        </div>
        <button id="reset" class="click">New Game</button>
    </div>

    <div id="overlay"></div>
    <div id="startpop" class="popup">
        <h1>Welcome to The<br/>ULTIMATE TIC TAC TOE</h1>
        <label>Player X Name:</label>
        <input type="text" id="playerXInput" placeholder="Player X"><br>

        <label>Player O Name:</label>
        <input type="text" id="playerOInput" placeholder="Player O"><br>

        <label>Number of Games:</label>
        <input type="number" id="numGamesInput" min="1" max="5" value="3"><br>

        <button id="startBtn" class="click">Play</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
